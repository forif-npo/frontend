<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title description">
  <title id="title">2026년 2학기 FORIF 기술블로그 백일장</title>
  <desc id="description">푸른 배경 위에 키보드와 펜을 표현한 기술블로그 백일장 행사 배너입니다. 행사는 9월 30일부터 10월 14일까지 진행됩니다.</desc>
  <defs>
    <linearGradient id="background" x1="48" y1="18" x2="1128" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#304D9D"/>
      <stop offset="0.54" stop-color="#3F62C6"/>
      <stop offset="1" stop-color="#5578E5"/>
    </linearGradient>
    <linearGradient id="keyboard" x1="744" y1="139" x2="1114" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91A9EA"/>
      <stop offset="1" stop-color="#718BD2"/>
    </linearGradient>
    <linearGradient id="pen" x1="872" y1="74" x2="1014" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#C9D6F8"/>
    </linearGradient>
    <filter id="keyboardShadow" x="683" y="113" width="483" height="203" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17316F" flood-opacity="0.3"/>
    </filter>
