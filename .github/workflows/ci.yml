name: PR Quality

on:
  pull_request:
    branches:
      - dev
      - release
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, and test
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: test-auth-secret
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_SERVICE_ACCOUNT_EMAIL: test-service-account@example.com
      GOOGLE_PRIVATE_KEY: test-private-key
      GOOGLE_CALENDAR_ID: test-calendar-id
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SERVER_URL: https://example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test
